<?xml version="1.0" standalone="no"?>
<svg id="logo-integrator-primary-dark" viewBox="0 0 550 100" class="w-full h-full max-h-full" xmlns="http://www.w3.org/2000/svg"><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
          
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeLeft { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideRight { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes assembleLeft { from { transform: translateX(-15px); opacity: 0; } to { transform: translateX(0); opacity: 0.9; } }
    @keyframes assembleRight { from { transform: translateX(15px); opacity: 0; } to { transform: translateX(0); opacity: 0.9; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
        </style><g><rect x="15" y="25" width="45" height="45" rx="10" fill="#2563eb" opacity="0.9" style="animation: 1s ease-out 0s 1 normal forwards running assembleLeft;"/><rect x="40" y="35" width="45" height="45" rx="10" fill="#f8fafc" opacity="0.9" style="animation: 1s ease-out 0s 1 normal forwards running assembleRight;"/><rect x="40" y="35" width="20" height="20" rx="6" fill="#0f172a" style="animation: 0.6s ease-out 0.8s 1 normal both running fadeIn;"/></g><text x="110" y="64" style="font-family: Inter, system-ui, sans-serif; font-weight: 700; letter-spacing: -0.05em; fill: rgb(255, 255, 255); font-size: 42px;">Implementation Pro</text></svg>